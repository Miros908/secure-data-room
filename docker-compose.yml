services:
  postgres:
    image: postgres:16
    container_name: sdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_data_room
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_data_room"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - sdr_postgres_data:/var/lib/postgresql/data

volumes:
  sdr_postgres_data:
